<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
	<meta name="theme-color" content="#070b12">
	<title>明日方舟：源石狂潮 · 在线游玩</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #070b12;
			color: #ece7da;
			font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", sans-serif;
			touch-action: none;
		}
		#canvas {
			display: block;
			width: 100vw;
			height: 100vh;
			outline: none;
			background: #070b12;
			image-rendering: pixelated;
		}
		#entry {
			position: fixed;
			inset: 0;
			z-index: 30;
			display: flex;
			align-items: center;
			justify-content: center;
			background:
				radial-gradient(circle at 50% 40%, rgba(228, 132, 43, 0.16), transparent 34%),
				linear-gradient(160deg, #080d15 0%, #0b111a 58%, #05080d 100%);
		}
		#entry::after {
			content: "";
			position: absolute;
			inset: 0;
			background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
			pointer-events: none;
		}
		.card {
			position: relative;
			z-index: 1;
			width: min(88vw, 680px);
			padding: 44px 36px 34px;
			border: 2px solid rgba(232, 146, 50, 0.72);
			background: rgba(10, 15, 22, 0.88);
			box-shadow: 0 0 0 6px rgba(232, 146, 50, 0.08), 0 28px 80px rgba(0,0,0,0.55);
			text-align: center;
		}
		.kicker {
			color: #e89232;
			font-size: 12px;
			letter-spacing: 0.32em;
			margin-bottom: 14px;
		}
		h1 {
			margin: 0;
			font-size: clamp(38px, 7vw, 76px);
			letter-spacing: 0.12em;
			line-height: 1;
			color: #f2eee2;
			text-shadow: 4px 4px 0 #161009, 0 0 22px rgba(232,146,50,0.22);
		}
		.subtitle {
			margin: 14px 0 0;
			color: #9e9684;
			font-size: 14px;
			letter-spacing: 0.18em;
		}
		.desc {
			margin: 24px auto 0;
			max-width: 470px;
			color: #b8b1a0;
			font-size: 13px;
			line-height: 1.9;
		}
		#start {
			margin: 28px auto 0;
			display: inline-block;
			padding: 14px 38px;
			border: 2px solid #f0a340;
			background: #e89232;
			color: #15110b;
			font-weight: 700;
			font-size: 19px;
			letter-spacing: 0.14em;
			cursor: pointer;
			box-shadow: 4px 4px 0 #1a1208;
			transition: transform 0.12s ease, background 0.12s ease;
		}
		#start:hover { background: #ffb052; }
		#start:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #1a1208; }
		#start[disabled] { background: #4a4438; border-color: #6d6350; color: #8d8474; cursor: default; }
		.tips {
			margin-top: 20px;
			color: #777062;
			font-size: 12px;
			line-height: 1.8;
		}
		#status {
			position: fixed;
			inset: 0;
			z-index: 20;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: #06080c;
			visibility: hidden;
		}
		#status progress {
			width: min(56vw, 460px);
			height: 8px;
			accent-color: #e89232;
		}
		#status-notice {
			display: none;
			max-width: 720px;
			margin: 28px 24px 0;
			padding: 18px 20px;
			border: 1px solid #9b3943;
			background: #24151a;
			color: #f0d8d8;
			font-size: 13px;
			line-height: 1.7;
			text-align: left;
			white-space: pre-wrap;
		}
		.loading-label {
			margin-bottom: 16px;
			color: #e89232;
			font-size: 12px;
			letter-spacing: 0.28em;
		}
		@media (max-width: 640px) {
			.card { padding: 32px 20px 26px; }
			.desc { font-size: 12px; }
			#start { padding: 13px 28px; font-size: 17px; }
		}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas" tabindex="0">你的浏览器不支持 Canvas。</canvas>

	<div id="entry">
		<div class="card">
			<div class="kicker">RHODES ISLAND // COMBAT LINK</div>
			<h1>源石狂潮</h1>
			<div class="subtitle">ARKNIGHTS: ORIGINIUM SURGE</div>
			<p class="desc">在感染者潮汐中坚持 10 分钟。自动攻击、升级构筑、源石地形与两名高危目标，全部在浏览器中运行。</p>
			<button id="start">点击进入战场</button>
			<div class="tips">建议横屏 · 支持鼠标 / 触屏虚拟摇杆 · 按 ESC 暂停<br>首次点击用于启用浏览器音频</div>
		</div>
	</div>

	<div id="status">
		<div class="loading-label">正在装载作战数据</div>
		<progress id="status-progress"></progress>
		<div id="status-notice"></div>
	</div>

	<script src="index.js"></script>
	<script>
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":4785128,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
		const GODOT_THREADS_ENABLED = false;
		const engine = new Engine(GODOT_CONFIG);

		const entry = document.getElementById('entry');
		const startButton = document.getElementById('start');
		const status = document.getElementById('status');
		const statusProgress = document.getElementById('status-progress');
		const statusNotice = document.getElementById('status-notice');
		let started = false;
		let initializing = false;

		function showNotice(text) {
			entry.style.display = 'none';
			status.style.visibility = 'visible';
			statusProgress.style.display = 'none';
			statusNotice.style.display = 'block';
			statusNotice.textContent = text;
		}

		function startGame() {
			if (started) return;
			started = true;
			initializing = true;
			entry.style.display = 'none';
			status.style.visibility = 'visible';
			statusProgress.style.display = 'block';
			statusNotice.style.display = 'none';
			const canvas = document.getElementById('canvas');
			if (canvas) canvas.focus();
			engine.startGame({
				onProgress: function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
					}
				},
			}).then(function () {
				initializing = false;
				status.remove();
				const c = document.getElementById('canvas');
				if (c) c.focus();
			}, function (err) {
				console.error(err);
				showNotice('启动失败：' + (err && err.message ? err.message : String(err)));
			});
		}

		const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
		if (missing.length !== 0) {
			startButton.disabled = true;
			startButton.textContent = '当前浏览器不支持';
			showNotice('当前浏览器缺少运行所需的 WebGL2 / WASM 功能：\n' + missing.join('\n'));
		}
		startButton.addEventListener('click', startGame);
		document.getElementById('canvas').addEventListener('click', function () {
			this.focus();
		});
		if (new URLSearchParams(window.location.search).get('autostart') === '1') {
			setTimeout(startGame, 200);
		}
		window.addEventListener('keydown', function (e) {
			if (!started && (e.key === 'Enter' || e.key === ' ')) {
				e.preventDefault();
				startGame();
			}
		});
	</script>
</body>
</html>
